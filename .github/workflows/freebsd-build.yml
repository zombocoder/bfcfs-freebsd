name: FreeBSD Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build on FreeBSD 14.3
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          # kyua and the compiler come with the FreeBSD base system; git is
          # only needed to fetch the kernel sources below.
          prepare: |
            pkg install -y git

          run: |
            # Print FreeBSD version
            freebsd-version
            uname -a

            # Verify kernel sources are available. The release src.txz is gone
            # from download.freebsd.org once a release reaches EOL, so take
            # sys/ from the matching releng branch in git instead.
            if [ ! -d /usr/src/sys ]; then
              rel=$(freebsd-version -k | cut -d- -f1)
              echo "Kernel sources not found at /usr/src/sys"
              echo "Fetching sys/ from releng/${rel}..."
              rm -rf /usr/src
              git clone --depth 1 --filter=blob:none --sparse \
                -b "releng/${rel}" https://git.FreeBSD.org/src.git /usr/src &&
                git -C /usr/src sparse-checkout set sys
            fi
            if [ ! -f /usr/src/sys/conf/kmod.mk ]; then
              echo "ERROR: kernel sources are not available"
              exit 1
            fi

            # Show compiler version
            cc --version

            # Clean any previous builds
            make clean || true

            # Build the kernel module
            echo "Building BFCFS kernel module..."
            make

            # Check if module was built
            if [ ! -f bfcfs.ko ]; then
              echo "ERROR: bfcfs.ko was not created"
              exit 1
            fi

            echo "Build successful!"
            ls -lh bfcfs.ko

            # Check module information
            file bfcfs.ko

            echo "Build successful! Now running tests..."

            # Verify test fixture exists
            if [ ! -f tests/fixtures/test.bfc ]; then
              echo "Warning: Test fixture tests/fixtures/test.bfc not found, skipping tests"
              echo "All checks passed (build only)!"
              exit 0
            fi

            echo "Test container found, proceeding with tests..."

            # Load the kernel module
            echo "Loading BFCFS kernel module..."
            kldload ./bfcfs.ko || {
              echo "ERROR: Failed to load kernel module"
              kldstat
              dmesg | tail -20
              exit 1
            }

            # Verify module is loaded
            kldstat | grep bfcfs || {
              echo "ERROR: Module not loaded"
              exit 1
            }

            # Run the tests
            echo "Running BFCFS tests..."
            cd tests
            kyua test || {
              echo "Tests failed, showing report:"
              kyua report --verbose
              cd ..
              kldunload bfcfs || true
              exit 1
            }

            # Show test report
            echo "Test results:"
            kyua report

            # Unload module
            cd ..
            kldunload bfcfs

            echo "All checks and tests passed!"
